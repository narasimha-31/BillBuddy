name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # placeholders so the build compiles; tests never call Supabase
      PUBLIC_SUPABASE_URL: https://ciplaceholder.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ciplaceholder
      SUPABASE_SECRET_KEY: sb_secret_ciplaceholder
      VERCEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
